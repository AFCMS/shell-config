"$schema" = 'https://starship.rs/config-schema.json'

# Inspired by https://starship.rs/presets/tokyo-night
 
### VSCODE ###
# To enable the starship prompt in vscode, add the following to your settings.json:
#
# "terminal.integrated.minimumContrastRatio": 1,
# "terminal.integrated.enableImages": true,
# "terminal.integrated.gpuAcceleration": "on",
# "terminal.integrated.fontFamily": "'Hack Nerd Font Mono', 'Droid Sans Mono', 'monospace', monospace",
# "editor.fontFamily": "'DroidSansM Nerd Font Mono', 'Droid Sans Mono', 'monospace', monospace","
# 
# Some icons still doesn't render for some reason
 
format = """
$os\
[](bg:#5d81c7 fg:#1d2230)\
$directory\
$hostname\
[](fg:#5d81c7 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$docker_context\
[](fg:#212736 bg:#1d2230)\
$time\
$jobs\
$status\
[ ](fg:#1d2230)\
\n$character"""
 
[os]
disabled = false
style = ""
format = "[ $symbol ](bg:#1d2230)"
 
[os.symbols]
Windows = "[](bg:#1d2230 fg:#0078D4)"
Ubuntu = "[](bg:#1d2230 fg:#E95420)"
Raspbian = "[](bg:#1d2230 fg:#A22846)"
Macos = "[](bg:#1d2230 fg:#FFFFFF)"
Linux = "[](bg:#1d2230 fg:#FCC624)"
Fedora = "[](bg:#1d2230 fg:#51A2DA)"
Android = "[](bg:#1d2230 fg:#34A853)"
Redhat = "[](bg:#1d2230 fg:#EE0000)"
RedHatEnterprise = "[](bg:#1d2230 fg:#EE0000)"
 
[directory]
disabled = false
style = "fg:#e3e5e5 bg:#5d81c7"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"
 
[directory.substitutions]
"Documents" = "󰈙"
"Téléchargements" = ""
"Musique" = ""
"Vidéos" = ""
"Images" = ""
 
[hostname]
disabled = false
ssh_only = true
ssh_symbol = "🌐"
trim_at = "."
detect_env_vars = []
format = '[\[$hostname\] ]($style)'
style = "bold bg:#5d81c7 fg:#394260"
 
[hostname.aliases]
 
[git_branch]
disabled = false
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'
 
[git_status]
disabled = false
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'
 
[time]
disabled = false
time_format = "%R"                                      # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
 
[jobs]
disabled = false
threshold = 1
symbol_threshold = 1
number_threshold = 1
format = '[$symbol $number ]($style)'
symbol = "✦"
style = "bold fg:bright-blue bg:#1d2230"
 
[status]
disabled = false
format = "[➔ $status ]($style)"
style = "bold fg:160 bg:#1d2230"
 
[character]
disabled = false
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"
 
